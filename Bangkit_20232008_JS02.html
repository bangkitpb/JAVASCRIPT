<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>To-Do List</title>
    <style>
        body {
            font-family: 'Times New Roman', Times, serif;
        }

        h2 {
            color: #333;
        }

        input {
            padding: 5px;
        }

        button {
            padding: 5px 10px;
            margin-left: 5px;
        }

        ul {
            margin-top: 10px;
        }
    </style>
</head>

<body>
    <h2>To-Do List</h2>
    <input type="text" id="tugas" placeholder="Tulis tugas...">
    <button onclick="tambahTugas()">Tambah</button>

    <ul id="daftarTugas">
    </ul>

    <script>
        function tambahTugas() {
            let input = document.getElementById("tugas");
            let teksTugas = input.value.trim();

            if (teksTugas === "") {
                alert("Tugas tidak boleh kosong!");
                return;
            }

            let liBaru = document.createElement("li");
            liBaru.textContent = teksTugas;

            document.getElementById("daftarTugas").appendChild(liBaru);

            input.value = "";
        }
    </script>

</body>

</html>
